<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helix-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="helix-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>
  
  <!-- Outer orbital ring with glow -->
  <ellipse cx="32" cy="32" rx="26" ry="26" stroke="url(#helix-glow)" stroke-width="0.5" fill="none" opacity="0.3" filter="url(#helix-blur)"/>
  <ellipse cx="32" cy="32" rx="26" ry="26" stroke="url(#helix-glow)" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="4,4">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Inner orbital ring -->
  <ellipse cx="32" cy="32" rx="18" ry="18" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="3,3">
    <animateTransform attributeName="transform" type="rotate" from="360 32 32" to="0 32 32" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Helix curves -->
  <path d="M 32 6 Q 48 16 32 26 Q 16 36 32 46 Q 48 56 32 58" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 32 6 Q 16 16 32 26 Q 48 36 32 46 Q 16 56 32 58" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Orbiting nodes -->
  <circle cx="32" cy="8" r="3" fill="#8B5CF6" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="8" r="5" stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="8" cy="32" r="3" fill="#38BDF8" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="90 32 32" to="450 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="8" cy="32" r="5" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="90 32 32" to="450 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="56" cy="32" r="3" fill="#8B5CF6" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="270 32 32" to="630 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central core with pulsing glow -->
  <circle cx="32" cy="32" r="6" fill="#8B5CF6" opacity="0.2" filter="url(#helix-blur)">
    <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="5" stroke="url(#helix-glow)" stroke-width="2" fill="none"/>
  <circle cx="32" cy="32" r="3" fill="url(#helix-glow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#38BDF8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Evolution indicators (small particles) -->
  <circle cx="44" cy="20" r="1.5" fill="#8B5CF6" opacity="0.7">
    <animate attributeName="cy" values="20;18;20" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="44" r="1.5" fill="#38BDF8" opacity="0.7">
    <animate attributeName="cy" values="44;46;44" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>