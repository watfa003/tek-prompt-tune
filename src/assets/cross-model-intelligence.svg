<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neural-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <filter id="neural-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>
  
  <!-- Connection lines with glow -->
  <line x1="12" y1="32" x2="26" y2="32" stroke="#8B5CF6" stroke-width="1" opacity="0.4" filter="url(#neural-blur)"/>
  <line x1="12" y1="32" x2="26" y2="18" stroke="#8B5CF6" stroke-width="1" opacity="0.4" filter="url(#neural-blur)"/>
  <line x1="12" y1="32" x2="26" y2="46" stroke="#8B5CF6" stroke-width="1" opacity="0.4" filter="url(#neural-blur)"/>
  
  <line x1="38" y1="32" x2="52" y2="32" stroke="#38BDF8" stroke-width="1" opacity="0.4" filter="url(#neural-blur)"/>
  <line x1="38" y1="18" x2="52" y2="32" stroke="#38BDF8" stroke-width="1" opacity="0.4" filter="url(#neural-blur)"/>
  <line x1="38" y1="46" x2="52" y2="32" stroke="#38BDF8" stroke-width="1" opacity="0.4" filter="url(#neural-blur)"/>
  
  <line x1="32" y1="18" x2="32" y2="46" stroke="url(#neural-glow)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Left node cluster -->
  <circle cx="12" cy="32" r="4" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <circle cx="12" cy="32" r="2" fill="#8B5CF6" opacity="0.8"/>
  
  <!-- Middle nodes -->
  <circle cx="32" cy="18" r="5" stroke="url(#neural-glow)" stroke-width="2" fill="none"/>
  <circle cx="32" cy="18" r="2.5" fill="#8B5CF6"/>
  
  <circle cx="32" cy="32" r="6" stroke="url(#neural-glow)" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="32" r="3" fill="url(#neural-glow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#38BDF8"/>
  
  <circle cx="32" cy="46" r="5" stroke="url(#neural-glow)" stroke-width="2" fill="none"/>
  <circle cx="32" cy="46" r="2.5" fill="#38BDF8"/>
  
  <!-- Right node cluster -->
  <circle cx="52" cy="32" r="4" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <circle cx="52" cy="32" r="2" fill="#38BDF8" opacity="0.8"/>
  
  <!-- Data flow particles -->
  <circle cx="20" cy="25" r="1" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="39" r="1" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer connection arcs -->
  <path d="M 16 28 Q 24 24 32 24" stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M 48 36 Q 40 40 32 40" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="2,2"/>
</svg>