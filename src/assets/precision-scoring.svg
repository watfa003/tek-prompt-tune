<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="precision-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <filter id="precision-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>
  
  <!-- Outer ring glow -->
  <circle cx="32" cy="32" r="28" stroke="url(#precision-glow)" stroke-width="0.5" fill="none" opacity="0.3" filter="url(#precision-blur)"/>
  
  <!-- Main outer ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#precision-glow)" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="22" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Targeting reticle lines -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="14" y2="32" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Corner markers -->
  <path d="M 20 14 L 14 14 L 14 20" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 44 14 L 50 14 L 50 20" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 20 50 L 14 50 L 14 44" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 44 50 L 50 50 L 50 44" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Central dot with glow -->
  <circle cx="32" cy="32" r="4" fill="#8B5CF6" opacity="0.3" filter="url(#precision-blur)"/>
  <circle cx="32" cy="32" r="3" fill="#8B5CF6"/>
  <circle cx="32" cy="32" r="1.5" fill="#38BDF8"/>
  
  <!-- Score arc indicators -->
  <path d="M 32 10 A 22 22 0 0 1 48 20" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 48 44 A 22 22 0 0 1 32 54" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>