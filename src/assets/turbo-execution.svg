<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="turbo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <filter id="turbo-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
    <filter id="turbo-intense">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>
  
  <!-- Energy burst glow background -->
  <circle cx="32" cy="32" r="20" fill="url(#turbo-glow)" opacity="0.15" filter="url(#turbo-intense)"/>
  
  <!-- Lightning bolt main shape with glow -->
  <path d="M 36 8 L 24 32 L 32 32 L 28 56 L 44 28 L 34 28 Z" fill="#8B5CF6" opacity="0.3" filter="url(#turbo-blur)"/>
  <path d="M 36 8 L 24 32 L 32 32 L 28 56 L 44 28 L 34 28 Z" fill="url(#turbo-glow)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Energy particles radiating outward -->
  <circle cx="48" cy="20" r="2" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="32" r="1.5" fill="#38BDF8" opacity="0.8">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="44" r="2" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="r" values="2;3;2" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="20" r="1.5" fill="#38BDF8" opacity="0.8">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="32" r="2" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="r" values="2;3;2" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="44" r="1.5" fill="#38BDF8" opacity="0.8">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Speed lines -->
  <line x1="8" y1="16" x2="18" y2="16" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="6" y1="24" x2="16" y2="24" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </line>
  <line x1="8" y1="32" x2="18" y2="32" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" begin="0.4s" repeatCount="indefinite"/>
  </line>
  <line x1="6" y1="40" x2="16" y2="40" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" begin="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="8" y1="48" x2="18" y2="48" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" begin="0.8s" repeatCount="indefinite"/>
  </line>
  
  <!-- Circuit traces -->
  <path d="M 46 16 L 52 16 L 52 22" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 46 48 L 52 48 L 52 42" stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Central energy core -->
  <circle cx="32" cy="32" r="2.5" fill="#38BDF8" opacity="0.8" filter="url(#turbo-blur)"/>
  <circle cx="32" cy="32" r="1.5" fill="#fff">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>